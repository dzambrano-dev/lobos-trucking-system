name: Firebase Rules CI

on:
  pull_request:
    paths:
      - "flutter_app/firestore.rules"
      - "flutter_app/storage.rules"
      - "flutter_app/firebase.json"
      - "firebase_tests/**"
      - ".github/workflows/firebase-rules-ci.yml"
  push:
    branches:
      - main
    paths:
      - "flutter_app/firestore.rules"
      - "flutter_app/storage.rules"
      - "flutter_app/firebase.json"
      - "firebase_tests/**"
      - ".github/workflows/firebase-rules-ci.yml"

permissions:
  contents: read

jobs:
  firebase-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase_tests/package-lock.json

      - name: Install test dependencies
        working-directory: firebase_tests
        run: npm ci

      - name: Test Firebase rules
        working-directory: firebase_tests
        run: npm test
